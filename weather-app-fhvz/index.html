<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#edf5ff">
  <title>Atmos — Weather, at a glance</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      --page: #edf5ff;
      --surface: rgba(255, 255, 255, .78);
      --surface-solid: #fff;
      --ink: #172b4d;
      --muted: #72829a;
      --line: rgba(31, 71, 125, .1);
      --accent: #3478ef;
      --accent-soft: #e8f1ff;
      --shadow: 0 20px 60px rgba(48, 82, 130, .1);
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      padding: 38px 18px 48px;
      color: var(--ink);
      background:
        radial-gradient(ellipse at 50% -15%, rgba(159, 201, 255, .58), transparent 52%),
        var(--page);
      font-size: 15px;
    }

    button, input { font: inherit; }
    button { color: inherit; }

    .app { width: min(100%, 490px); margin: 0 auto; }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 0 2px 24px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 17px;
      font-weight: 750;
      letter-spacing: -.045em;
    }

    .brand-mark {
      display: grid;
      width: 34px;
      height: 34px;
      place-items: center;
      color: white;
      background: linear-gradient(145deg, #77b5ff, #4384ef);
      border-radius: 12px;
      box-shadow: 0 6px 15px rgba(66, 132, 239, .26);
    }

    .brand-mark svg { width: 20px; height: 20px; }

    .eyebrow {
      color: var(--muted);
      font-size: 11px;
      font-weight: 750;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .search {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 52px;
      padding: 6px 7px 6px 16px;
      background: var(--surface-solid);
      border: 1px solid var(--line);
      border-radius: 17px;
      box-shadow: 0 8px 24px rgba(48, 82, 130, .06);
    }

    .search svg { flex: none; width: 19px; color: var(--muted); }

    .search input {
      width: 100%;
      min-width: 0;
      padding: 8px 0;
      color: var(--ink);
      background: transparent;
      border: 0;
      outline: 0;
      font-size: 14px;
    }

    .search input::placeholder { color: #9aa8ba; }

    .search button {
      flex: none;
      min-height: 38px;
      padding: 0 16px;
      color: white;
      background: var(--accent);
      border: 0;
      border-radius: 12px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 700;
      transition: transform .18s ease, filter .18s ease;
    }

    .search button:hover { filter: brightness(1.07); }
    .search button:active { transform: scale(.97); }
    :focus-visible { outline: 3px solid rgba(52, 120, 239, .42); outline-offset: 3px; }

    .message {
      min-height: 19px;
      margin: 9px 4px 5px;
      color: var(--muted);
      font-size: 12px;
    }

    .message.error { color: #c15748; }

    .weather-panel {
      position: relative;
      overflow: hidden;
      margin-top: 8px;
      padding: 27px 28px 24px;
      color: #183962;
      background:
        radial-gradient(circle at 88% 10%, rgba(255, 255, 255, .8), transparent 28%),
        linear-gradient(135deg, #dceeff 0%, #c8e3ff 48%, #b7d8fc 100%);
      border: 1px solid rgba(255, 255, 255, .76);
      border-radius: 25px;
      box-shadow: var(--shadow);
    }

    .weather-panel::after {
      position: absolute;
      right: -38px;
      bottom: -110px;
      width: 245px;
      height: 245px;
      content: "";
      background: rgba(255, 255, 255, .16);
      border: 1px solid rgba(255, 255, 255, .25);
      border-radius: 50%;
      pointer-events: none;
    }

    .location-row, .current-main, .current-bottom { position: relative; z-index: 1; }

    .location-row { display: flex; justify-content: space-between; align-items: start; }

    .city {
      margin: 5px 0 3px;
      font-size: 25px;
      font-weight: 750;
      letter-spacing: -.045em;
    }

    .date { color: rgba(24, 57, 98, .67); font-size: 13px; }

    .live-dot {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin-top: 5px;
      color: rgba(24, 57, 98, .67);
      font-size: 11px;
      font-weight: 650;
    }

    .live-dot::before {
      width: 7px;
      height: 7px;
      content: "";
      background: #39a878;
      border-radius: 50%;
      box-shadow: 0 0 0 3px rgba(57, 168, 120, .13);
    }

    .current-main {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 175px;
      padding: 8px 1px 0;
    }

    .temperature {
      font-size: clamp(82px, 22vw, 112px);
      font-weight: 650;
      letter-spacing: -.09em;
      line-height: .98;
    }

    .temperature sup {
      position: relative;
      top: -.2em;
      margin-left: 4px;
      font-size: .33em;
      font-weight: 500;
      letter-spacing: -.04em;
    }

    .condition-block { text-align: right; }

    .weather-icon {
      display: block;
      margin-bottom: -3px;
      font-size: 59px;
      line-height: 1.15;
      filter: drop-shadow(0 8px 9px rgba(57, 103, 161, .14));
    }

    .condition { font-size: 14px; font-weight: 700; }

    .current-bottom {
      display: flex;
      align-items: center;
      gap: 0;
      padding-top: 18px;
      border-top: 1px solid rgba(24, 57, 98, .12);
    }

    .metric { flex: 1; }
    .metric + .metric { padding-left: 20px; border-left: 1px solid rgba(24, 57, 98, .12); }
    .metric-label { color: rgba(24, 57, 98, .62); font-size: 11px; }
    .metric-value { margin-top: 5px; font-size: 14px; font-weight: 720; }

    .forecast-section { margin-top: 28px; }

    .section-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 0 3px 13px;
    }

    .section-heading h2 { margin: 0; font-size: 15px; font-weight: 750; letter-spacing: -.02em; }
    .section-heading span { color: var(--muted); font-size: 12px; }

    .forecast {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 9px;
    }

    .day-card {
      min-width: 0;
      padding: 14px 5px 13px;
      text-align: center;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 17px;
      box-shadow: 0 8px 22px rgba(48, 82, 130, .04);
      backdrop-filter: blur(10px);
    }

    .day-name { color: var(--muted); font-size: 11px; font-weight: 650; }
    .day-icon { display: block; margin: 10px 0 8px; font-size: 23px; line-height: 1.2; }
    .day-temps { display: flex; justify-content: center; gap: 6px; font-size: 12px; font-weight: 730; }
    .day-low { color: var(--muted); font-weight: 550; }

    .source-note {
      margin: 19px 2px 0;
      color: var(--muted);
      text-align: center;
      font-size: 11px;
    }

    .source-note a { color: inherit; text-decoration-color: rgba(114, 130, 154, .45); text-underline-offset: 2px; }

    @media (max-width: 390px) {
      body { padding: 25px 13px 36px; }
      .weather-panel { padding: 22px 20px 20px; }
      .current-main { min-height: 155px; }
      .forecast { gap: 6px; }
      .day-card { padding-right: 2px; padding-left: 2px; }
      .day-temps { gap: 4px; font-size: 11px; }
    }

    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --page: #101a2b;
        --surface: rgba(25, 39, 60, .85);
        --surface-solid: #19273c;
        --ink: #edf4ff;
        --muted: #9aaac1;
        --line: rgba(191, 212, 242, .1);
        --accent: #5d9aff;
        --accent-soft: #203653;
        --shadow: 0 20px 60px rgba(0, 0, 0, .24);
      }

      body {
        background:
          radial-gradient(ellipse at 50% -15%, rgba(43, 91, 158, .38), transparent 52%),
          var(--page);
      }

      .brand-mark { background: linear-gradient(145deg, #78baff, #427ce0); }
      .weather-panel {
        color: #eaf4ff;
        background:
          radial-gradient(circle at 88% 10%, rgba(198, 224, 255, .12), transparent 28%),
          linear-gradient(135deg, #243e61 0%, #294f79 52%, #28557e 100%);
        border-color: rgba(195, 221, 255, .12);
      }

      .date, .live-dot, .metric-label { color: rgba(234, 244, 255, .69); }
      .current-bottom, .metric + .metric { border-color: rgba(234, 244, 255, .15); }
      .search input::placeholder { color: #8091aa; }
      .message.error { color: #ff9b88; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M16.5 15.5a4.5 4.5 0 1 1-4.24-5.99A5.5 5.5 0 0 0 16.5 15.5Z" fill="currentColor"/>
            <path d="M17.5 4v2m0 12v2M7.5 12h-2m16 0h-2m-1.93-5.57-1.42 1.42m-8.3 8.3-1.42 1.42m0-11.14 1.42 1.42" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </span>
        <span>atmos</span>
      </div>
      <span class="eyebrow">Weather, at a glance</span>
    </header>

    <form class="search" id="search-form" role="search">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <circle cx="10.8" cy="10.8" r="6.8" stroke="currentColor" stroke-width="1.7"/>
        <path d="m16 16 4.2 4.2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
      </svg>
      <input id="city-input" type="search" placeholder="Search for a city..." aria-label="Search for a city" autocomplete="off">
      <button type="submit" id="search-button">Search</button>
    </form>
    <p class="message" id="message" role="status" aria-live="polite"></p>

    <section class="weather-panel" aria-label="Current weather">
      <div class="location-row">
        <div>
          <div class="eyebrow">Right now in</div>
          <h1 class="city" id="city-name">Tokyo</h1>
          <div class="date" id="current-date"></div>
        </div>
        <span class="live-dot" id="data-status">Live weather</span>
      </div>
      <div class="current-main">
        <div class="temperature" id="temperature" aria-label="Current temperature">--<sup>°</sup></div>
        <div class="condition-block">
          <span class="weather-icon" id="current-icon" aria-hidden="true">🌤️</span>
          <div class="condition" id="condition">Loading...</div>
        </div>
      </div>
      <div class="current-bottom">
        <div class="metric">
          <div class="metric-label">Feels like</div>
          <div class="metric-value" id="feels-like">--°</div>
        </div>
        <div class="metric">
          <div class="metric-label">Humidity</div>
          <div class="metric-value" id="humidity">--%</div>
        </div>
        <div class="metric">
          <div class="metric-label">Wind</div>
          <div class="metric-value" id="wind">-- km/h</div>
        </div>
      </div>
    </section>

    <section class="forecast-section" aria-labelledby="forecast-title">
      <div class="section-heading">
        <h2 id="forecast-title">5-day forecast</h2>
        <span>Daily outlook</span>
      </div>
      <div class="forecast" id="forecast" aria-live="polite"></div>
    </section>
    <p class="source-note">Weather data by <a href="https://open-meteo.com/" target="_blank" rel="noreferrer">Open-Meteo</a></p>
  </main>

  <script>
    const fallbackStart = new Date();
    fallbackStart.setHours(12, 0, 0, 0);
    const fallbackDates = Array.from({ length: 6 }, (_, offset) => {
      const date = new Date(fallbackStart);
      date.setDate(date.getDate() + offset);
      return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}-${String(date.getDate()).padStart(2, "0")}`;
    });

    const fallbackWeather = {
      current: { temperature_2m: 22, apparent_temperature: 23, relative_humidity_2m: 58, wind_speed_10m: 12, weather_code: 2 },
      daily: {
        time: fallbackDates,
        weather_code: [2, 1, 3, 61, 2, 0],
        temperature_2m_max: [24, 25, 22, 19, 23, 26],
        temperature_2m_min: [17, 18, 16, 15, 16, 18]
      }
    };

    const weatherTypes = [
      { codes: [0], label: "Clear sky", icon: "☀️" },
      { codes: [1], label: "Mostly clear", icon: "🌤️" },
      { codes: [2], label: "Partly cloudy", icon: "⛅" },
      { codes: [3], label: "Overcast", icon: "☁️" },
      { codes: [45, 48], label: "Foggy", icon: "🌫️" },
      { codes: [51, 53, 55, 56, 57], label: "Drizzle", icon: "🌦️" },
      { codes: [61, 63, 65, 66, 67], label: "Rain", icon: "🌧️" },
      { codes: [71, 73, 75, 77], label: "Snow", icon: "❄️" },
      { codes: [80, 81, 82], label: "Showers", icon: "🌦️" },
      { codes: [85, 86], label: "Snow showers", icon: "🌨️" },
      { codes: [95, 96, 99], label: "Thunderstorm", icon: "⛈️" }
    ];

    const form = document.querySelector("#search-form");
    const input = document.querySelector("#city-input");
    const button = document.querySelector("#search-button");
    const message = document.querySelector("#message");

    function weatherFor(code) {
      return weatherTypes.find((type) => type.codes.includes(code)) || { label: "Variable conditions", icon: "🌤️" };
    }

    function render(data, city, usingFallback) {
      const current = data.current;
      const daily = data.daily;
      const condition = weatherFor(current.weather_code);
      document.querySelector("#city-name").textContent = city;
      document.querySelector("#current-date").textContent = new Intl.DateTimeFormat(undefined, {
        weekday: "long", month: "long", day: "numeric"
      }).format(new Date());
      document.querySelector("#temperature").innerHTML = `${Math.round(current.temperature_2m)}<sup>°</sup>`;
      document.querySelector("#temperature").setAttribute("aria-label", `${Math.round(current.temperature_2m)} degrees`);
      document.querySelector("#current-icon").textContent = condition.icon;
      document.querySelector("#condition").textContent = condition.label;
      document.querySelector("#feels-like").textContent = `${Math.round(current.apparent_temperature ?? current.temperature_2m)}°`;
      document.querySelector("#humidity").textContent = `${Math.round(current.relative_humidity_2m ?? 0)}%`;
      document.querySelector("#wind").textContent = `${Math.round(current.wind_speed_10m ?? 0)} km/h`;
      document.querySelector("#data-status").textContent = usingFallback ? "Sample weather" : "Live weather";

      const forecast = document.querySelector("#forecast");
      forecast.replaceChildren();
      for (let i = 1; i <= 5; i += 1) {
        const date = new Date(`${daily.time[i]}T12:00:00`);
        const dayCondition = weatherFor(daily.weather_code[i]);
        const card = document.createElement("article");
        card.className = "day-card";
        card.setAttribute("aria-label", `${new Intl.DateTimeFormat(undefined, { weekday: "long" }).format(date)}: ${dayCondition.label}, high ${Math.round(daily.temperature_2m_max[i])} degrees, low ${Math.round(daily.temperature_2m_min[i])} degrees`);
        card.innerHTML = `
          <div class="day-name">${new Intl.DateTimeFormat(undefined, { weekday: "short" }).format(date)}</div>
          <span class="day-icon" aria-hidden="true">${dayCondition.icon}</span>
          <div class="day-temps"><span>${Math.round(daily.temperature_2m_max[i])}°</span><span class="day-low">${Math.round(daily.temperature_2m_min[i])}°</span></div>
        `;
        forecast.append(card);
      }
    }

    async function fetchWeather(city) {
      const geocodeUrl = new URL("https://geocoding-api.open-meteo.com/v1/search");
      geocodeUrl.search = new URLSearchParams({ name: city, count: "1", language: "en", format: "json" });
      const geocodeResponse = await fetch(geocodeUrl);
      if (!geocodeResponse.ok) throw new Error("City search is temporarily unavailable.");
      const result = (await geocodeResponse.json()).results?.[0];
      if (!result) throw new Error(`We couldn't find "${city}". Try another city.`);

      const forecastUrl = new URL("https://api.open-meteo.com/v1/forecast");
      forecastUrl.search = new URLSearchParams({
        latitude: result.latitude,
        longitude: result.longitude,
        current: "temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m",
        daily: "weather_code,temperature_2m_max,temperature_2m_min",
        timezone: "auto",
        forecast_days: "6"
      });
      const forecastResponse = await fetch(forecastUrl);
      if (!forecastResponse.ok) throw new Error("Weather data is temporarily unavailable.");
      const weather = await forecastResponse.json();
      const location = [result.name, result.admin1, result.country].filter(Boolean);
      return { weather, city: [...new Set(location)].join(", ") };
    }

    async function loadWeather(city, initialLoad = false) {
      button.disabled = true;
      button.textContent = "Loading";
      message.classList.remove("error");
      message.textContent = "";
      try {
        const result = await fetchWeather(city);
        render(result.weather, result.city, false);
      } catch (error) {
        if (initialLoad) {
          render(fallbackWeather, "India", true);
          message.textContent = "Showing sample weather — live data couldn't be reached.";
        } else if (error.message.startsWith("We couldn't find")) {
          message.textContent = error.message;
          message.classList.add("error");
        } else {
          render(fallbackWeather, city, true);
          message.textContent = `${error.message} Showing sample weather instead.`;
          message.classList.add("error");
        }
      } finally {
        button.disabled = false;
        button.textContent = "Search";
      }
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const city = input.value.trim();
      if (!city) {
        input.focus();
        message.textContent = "Enter a city to see its weather.";
        message.classList.add("error");
        return;
      }
      loadWeather(city);
    });

    render(fallbackWeather, "India", true);
    loadWeather("india", true);
  </script>
</body>
</html>
